[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openlongtail"
version = "0.3.0"
description = "Surround-view generation from a single front-camera driving video"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["openlongtail*"]
